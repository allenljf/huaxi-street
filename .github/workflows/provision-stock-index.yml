name: Provision stock-index Pages project
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: market-journal-production
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Create and validate the Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          url=$(python3 -m market.cloudflare --project stock-index)
          if [ "$url" != 'https://stock-index.pages.dev' ]; then
            echo "Cloudflare returned a different address: $url"
            exit 1
          fi
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Deploy new Pages project
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name stock-index --branch main
