name: Update market journal
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 0 * * 6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-journal-production
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 * * 6' || vars.INCLUDE_SATURDAY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check calculation contracts
        run: python -m unittest discover -s tests -v
      - name: Fetch approved open data and generate snapshot
        env:
          INCLUDE_SATURDAY: ${{ vars.INCLUDE_SATURDAY }}
        run: python -m market.pipeline
      - name: Preserve approved daily history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json data/calendar.json web/public/data/markets.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update daily closed-market snapshot'
            git push
          fi
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy static journal
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Summarize
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('web/public/data/markets.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# 陪葬! 華西街\n')
              for m in d['markets']:
                  f.write(f"- {m['name']}: {m['sessionDate']} / {m['status']} / {m['reasons'][0]}\n")
          PY
