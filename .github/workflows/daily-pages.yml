name: Update market journal
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      batch:
        description: 'Markets to update'
        type: choice
        default: all
        options: [all, asia, us]
  schedule:
    - cron: '0 8 * * 1-5' # Taipei Mon-Fri 16:00: Taiwan/Japan/Korea
    - cron: '0 0 * * 2-6' # Taipei Tue-Sat 08:00: previous US session
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-journal-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: ${{ vars.DEPLOY_TARGET == 'cloudflare' && 'cloudflare-pages' || 'github-pages' }}
      url: ${{ vars.DEPLOY_TARGET == 'cloudflare' && vars.CLOUDFLARE_PAGES_URL || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install market calendars
        run: python -m pip install -r requirements.txt
      - name: Select regional batch
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_BATCH: ${{ inputs.batch }}
        run: |
          python - <<'PY'
          import os
          from market.sessions import batch_for_schedule
          batch=os.environ.get('INPUT_BATCH') or batch_for_schedule(os.environ.get('EVENT_SCHEDULE'))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('MARKET_BATCH='+batch+'\n')
          PY
      - name: Check calculation contracts
        run: python -m unittest discover -s tests -v
      - name: Fetch approved open data and generate snapshot
        env:
          ENABLE_RESEARCH_SOURCES: ${{ vars.ENABLE_RESEARCH_SOURCES }}
          PUBLISH_RESEARCH_SOURCES: ${{ vars.PUBLISH_RESEARCH_SOURCES }}
        run: |
          python -m market.pipeline --batch "$MARKET_BATCH"
          # A private research fetch must not prevent the approved public feed updating.
          if [[ "$ENABLE_RESEARCH_SOURCES" == 'true' && "$PUBLISH_RESEARCH_SOURCES" != 'true' ]]; then
            ENABLE_RESEARCH_SOURCES=false PUBLISH_RESEARCH_SOURCES=false python -m market.pipeline --batch "$MARKET_BATCH"
          fi
      - name: Preserve approved daily history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json data/calendar.json data/sentiment.json web/public/data/markets.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update daily closed-market snapshot'
            git push
          fi
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
        if: vars.DEPLOY_TARGET != 'cloudflare'
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_TARGET != 'cloudflare'
        with:
          path: web/dist
      - name: Deploy static journal
        id: deploy
        if: vars.DEPLOY_TARGET != 'cloudflare'
        uses: actions/deploy-pages@v4
      - name: Deploy to Cloudflare Pages
        if: vars.DEPLOY_TARGET == 'cloudflare'
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [[ ! "$CF_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo 'Missing or invalid Cloudflare Pages project name'; exit 1
          fi
          npx wrangler pages deploy dist --project-name "$CF_PROJECT" --branch main
      - name: Summarize
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('web/public/data/markets.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# 陪葬! 華西街\n')
              for m in d['markets']:
                  f.write(f"- {m['name']}: {m['sessionDate']} / {m['status']} / {m['reasons'][0]}\n")
          PY
